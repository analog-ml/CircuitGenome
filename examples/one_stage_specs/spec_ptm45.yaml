# Feasible one-stage op-amp spec for PTM 45 nm HP bulk.
# Technology: ptm45, circuitgenome/sizer/config/tech_ptm45.yaml
# Supply: 1.0 V, 10 µA bias current.  One-stage: no Miller cap, so GBW/PM/SR are not modelled.
#
# Usage:
#   circuitgenome size circuits/one_stage_opamp/circuit_0001_flat.ckt \
#     --topology one_stage_opamp \
#     --spec examples/one_stage_specs/spec_ptm45.yaml \
#     --tech ptm45

vdd: 1.0            # V — positive supply
vss: 0.0            # V — ground
ibias: 10.0e-6      # A — input bias current
cl: 2.0e-12       # F — output load capacitance

# DC and frequency performance
gain_min_db: 30           # dB — minimum open-loop DC gain.  A single active-load
                          # stage at 45 nm tops out near 31 dB (gm·(ro_n‖ro_p)
                          # with the node's high λ), so 30 dB is the honest ceiling
                          # for a one-stage example here — two-/three-stage specs
                          # target higher gain because they cascade stages.

# Power and swing
power_max_w: 5.0e-4      # W  — maximum total quiescent power
output_swing_max_v: 0.85   # V  — 0.15 V headroom from VDD
output_swing_min_v: 0.15    # V  — 0.15 V headroom from VSS
