# Two-stage single-ended op-amp spec for the SKY130 1.8 V core (gm/Id sizer).
# Re-tuned for feasibility at the 1.8 V rail (issue #77). Unlike the 3.3 V gf180
# spec, sky130's tight supply headroom caps the usable bias current, so:
#   - GBW is current-limited (~0.9 MHz at Itail ~15 uA); gbw_min is 0.8 MHz.
#   - the sizer's second-stage gm requirement exceeds the weak-inversion gm/Id
#     ceiling once gain_min >~ 45 dB, so the gain floor is held at 40 dB — the
#     feasible circuits then measure ~63 dB open-loop in ngspice.
#   - ibias is 15 uA (vs gf180's 20 uA) to preserve the stacked-Vdsat headroom
#     the tail and second stage need under 1.8 V.
# Verified: 9/24 enumerated circuits meet every margin in ngspice (worst-case
# margin +12%, GBW-bound). The remaining failures are real bias limits at 1.8 V
# (cascode/stacked-Vdsat headroom and the second-stage gm ceiling), not tooling.
vdd: 1.8
vss: 0.0
ibias: 15.0e-6
cl: 5.0e-12
second_stage_current_ratio: 2.5
gain_min_db: 40
gbw_min_hz: 0.8e+6
phase_margin_min_deg: 60
slew_rate_min_vps: 3.0e+5
power_max_w: 2.0e-3
output_swing_max_v: 1.5
output_swing_min_v: 0.3
