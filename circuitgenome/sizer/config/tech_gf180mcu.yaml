# GF180MCU 180nm core 3.3V devices (nmos_3p3 / pmos_3p3), BSIM4 level=54.
# A foundry PDK referenced via a corner library (`.lib <file> <corner>`); its
# devices are subcircuits, so this tech carries `spice_lib` + `device_map`
# instead of PTM's flat `spice_model`. Sizing uses the gm/Id LUT
# (models/gf180mcu_gmid.npz, characterized at the `typical` corner with
# tools/extract_tech.py --node gf180mcu --gm-id); the CLI measures performance
# in ngspice and reports the {typical,ss,ff,sf,fs} corner sweep.
# Source: GlobalFoundries GF180MCU open PDK (sm141064.ngspice).
name: gf180mcu_3v3
description: "GF180MCU 180nm core 3.3V (nmos_3p3/pmos_3p3, BSIM4 level=54)"

spice_lib:
  design: ../pdk/gf180/ngspice/design.ngspice   # global statistical/noise switches
  file: ../pdk/gf180/ngspice/sm141064.ngspice    # corner library
  corner: typical                                # nominal corner for sizing
  corners: [typical, ss, ff, sf, fs]             # CLI verification sweep
  mismatch_switch: sw_stat_mismatch              # per-device mismatch (FD CMRR/PSRR)

device_map:                                      # generic type -> PDK subcircuit
  nmos: nmos_3p3
  pmos: pmos_3p3

gmid_lut: models/gf180mcu_gmid.npz   # gm/Id LUT (drives sizing)

# The gm/Id path sizes off the LUT above, so no Level-1 square-law params are
# needed (issue #158): mu_cox/lam and vth are all omitted. The load-resistor
# bias seed is read from the LUT (the driven signal device's Vgs), so no
# hand-curated vth is required. gamma/phi are retained for the body-effect
# model (issue #106).
# cox (F/µm²) = εox/toxe from the corner library's nmos_3p3/pmos_3p3 model
# cards (epsrox=3.9, toxe=8.0 nm nmos / 7.9 nm pmos).  It is not a square-law
# parameter: it feeds only Cgs = (2/3)·W·L·Cox, which places a single-stage
# OTA's mirror pole (issue #221).  Cross-checked against the LUT's ft-implied
# Cgg = gm/(2π·ft) — agreement is within ~5-50% across the L axis.
# cdb (F/µm of width) is ngspice's drain-bulk junction capacitance (capbd) of
# a saturated nmos_3p3/pmos_3p3 at |Vdb| = 1.65 V (Vdd/2): it scales with W
# alone (identical at W = 10/100 µm, L = 0.56/1.12 µm) and moves only ±13 %
# over |Vdb| = 0.8-2.5 V (#266).  cgdo/cgso are the gate-drain/-source
# overlaps; tools/extract_tech.py --caps reads all three (gm/Id 20, issue
# #278).  The full-model GBW/PM put a second stage's cgdo beside the Miller
# cap, cgso with each gate's load and cdb on each node's drains.
nmos:
  gamma: 0.3101          # √V   body-effect coefficient γ (issue #106)
  phi: 0.3650            # V    surface potential 2φF
  cox: 4.316e-15         # F/µm² (toxe = 8.0 nm)
  cgdo: 2.658e-16        # F/µm  gate-drain overlap
  cgso: 3.295e-16        # F/µm  gate-source overlap
  cdb: 4.13e-16          # F/µm  drain junction capacitance per µm of width
pmos:
  gamma: 0.5220          # √V   body-effect coefficient γ (issue #106)
  phi: 0.4900            # V    surface potential 2φF
  cox: 4.371e-15         # F/µm² (toxe = 7.9 nm)
  cgdo: 1.393e-16        # F/µm  gate-drain overlap
  cgso: 1.639e-16        # F/µm  gate-source overlap
  cdb: 3.64e-16          # F/µm  drain junction capacitance per µm of width

width:
  min: 0.22
  max: 100.0
  step: 0.005

length:
  min: 0.28
  max: 4.0
  step: 0.02

cap:
  min_pf: 0.01
  max_pf: 20.0
  step_pf: 0.01
